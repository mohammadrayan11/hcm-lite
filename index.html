<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCM Lite</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="style.css"></head><body>

<section id="login">
 <div class="brand">
  <div><h1>HCM Lite</h1><p>People, attendance, leave and payroll for one small team. Sign in with your work email to open your own panel.</p></div>
  <div class="roles" id="roles"></div>
</div>
 <div class="formside"><div class="formbox">
  <h2>Welcome</h2><span class="mode" id="mode"></span>
  <div class="tabs"><button type="button" id="tin" class="on" onclick="showTab('in')">Sign in</button><button type="button" id="tup" onclick="showTab('up')">Create account</button></div>
  <form id="lf">
   <label for="em">Email</label><input id="em" type="email" required autocomplete="username" placeholder="you@company.com">
   <label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password">
   <button class="btn full" id="lb">Sign in</button><div class="err" id="err" role="alert"></div>
  </form>
  <form id="sf" class="hidden">
   <label for="su_name">Full name</label><input id="su_name" required autocomplete="name">
   <label for="su_email">Email</label><input id="su_email" type="email" required autocomplete="username" placeholder="you@company.com">
   <label for="su_pw">Password (6+ characters)</label><input id="su_pw" type="password" minlength="6" required autocomplete="new-password">
   <label for="su_role">I am a</label><select id="su_role"><option value="employee">Employee</option><option value="hr">HR</option><option value="manager">Manager</option></select>
   <button class="btn full" id="su_btn">Create account</button><div class="err" id="su_err" role="alert"></div>
  </form>
 </div></div>
</section>

<div id="app" class="hidden">
 <aside><div class="logo">HCM Lite</div><div class="badge" id="badge"></div><nav id="nav" style="display:contents"></nav><a class="out" onclick="logout()">Sign out</a></aside>
 <main id="main"></main>
</div>
<div id="toast"></div>

<script src="script.js"></script>
</body></html>
